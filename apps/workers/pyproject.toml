[project]
name = "platform-workers"
version = "0.1.0"
description = "ML pipeline workers (Temporal)"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Document parsing (CPU-only)
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "langdetect>=1.0.9",
    # Infrastructure clients
    "asyncpg>=0.29.0",
    # >=1.36 required: S3_COMPAT_CONFIG uses request/response_checksum_* Config
    # knobs (added in botocore 1.36) so AWS/MinIO/R2 all work — see s3_client.py.
    "boto3>=1.36.0",
    "redis>=5.0.0",
    # LLM API (OpenAI-compatible)
    "httpx>=0.27.0",
    # Structured logging
    "python-json-logger>=3.2.0",
    # Observability (OpenTelemetry)
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
    "opentelemetry-instrumentation-logging>=0.50b0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.optional-dependencies]
ml = [
    "unsloth>=2025.12",
    "transformers>=4.51.0,<5.0.0",
    "datasets>=3.2.0",
    "distilabel>=1.5.0",
    "trl>=0.16.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "pynvml>=12.0.0",
]
gpu-cloud = [
    # >=1.4.3: Function.with_options(gpu=...) for per-call GPU override
    # (used in ModalGpuProvider); it did not exist on modal.Function before then.
    "modal>=1.4.3",
]
# Alternative PDF backend (richer structure extraction, larger install)
pdf-ml = [
    "docling>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
