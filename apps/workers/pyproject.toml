[project]
name = "platform-workers"
version = "0.1.0"
description = "ML pipeline workers (Temporal)"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
ml = [
    "unsloth>=2025.3",
    "transformers>=4.48.0",
    "datasets>=3.2.0",
    "distilabel>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
