[project]
name = "platform-workers"
version = "0.1.0"
description = "ML pipeline workers (Temporal)"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Document parsing (CPU-only)
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "langdetect>=1.0.9",
    # Infrastructure clients
    "asyncpg>=0.29.0",
    "boto3>=1.35.0",
    "redis>=5.0.0",
    # LLM API (OpenAI-compatible)
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[project.optional-dependencies]
ml = [
    "unsloth>=2025.3",
    "transformers>=4.48.0",
    "datasets>=3.2.0",
    "distilabel>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
