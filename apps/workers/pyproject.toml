[project]
name = "platform-workers"
version = "0.1.0"
description = "ML pipeline workers (Temporal)"
# Upper bound is real, not defensive: the GPU stacks (unsloth, vllm, torch) ship
# no 3.14-compatible release, and every image we build runs 3.11. Without the
# bound, resolution is attempted for interpreters no ML dependency supports.
requires-python = ">=3.11,<3.14"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Document parsing (CPU-only)
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "langdetect>=1.0.9",
    # Infrastructure clients
    "asyncpg>=0.29.0",
    # >=1.36 required: S3_COMPAT_CONFIG uses request/response_checksum_* Config
    # knobs (added in botocore 1.36) so AWS/MinIO/R2 all work — see s3_client.py.
    "boto3>=1.36.0",
    "redis>=5.0.0",
    # LLM API (OpenAI-compatible)
    "httpx>=0.27.0",
    # AES-256-GCM decryption of tenant API keys stored encrypted by the API
    "cryptography>=42.0.0",
    # Teacher logprob artifacts are columnar arrays; extract_logprobs imports
    # this at module level, so it is a runtime need on the worker, not just in
    # the ml extra where torch would otherwise drag it in.
    "numpy>=1.26.0",
    # Structured logging
    "python-json-logger>=3.2.0",
    # Observability (OpenTelemetry)
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
    "opentelemetry-instrumentation-logging>=0.50b0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # Renders the ChatML fallback chat template in tests exactly as the
    # tokenizer runtime does; already a transitive runtime dep of the ml extra.
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
ml = [
    # linux-only: unsloth's zoo pulls mlx-lm on Apple silicon, whose
    # transformers>=5 floor cannot coexist with the <5 bound below. The GPU
    # containers this extra exists for are all linux.
    "unsloth==2026.8.4; sys_platform == 'linux'",
    "transformers>=4.51.0,<5.0.0",
    "datasets>=3.2.0",
    # Pinned exactly, not floated, so a rebuild cannot change training behaviour
    # with no code change. This is NOT the on-policy TRL version: unsloth
    # constrains trl to <=0.24.0, so the two stacks are on different majors and
    # the on-policy trainers simply do not exist in this one. 0.24.0 is the
    # newest release unsloth allows, which is what an unpinned install resolved
    # to anyway.
    "trl==0.24.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "pynvml>=12.0.0",
]
gpu-cloud = [
    # >=1.4.3: Function.with_options(gpu=...) for per-call GPU override
    # (used in ModalGpuProvider); it did not exist on modal.Function before then.
    "modal>=1.4.3",
]
# Teacher logprob extraction (offline distillation). vLLM cannot share the `ml`
# stack: unsloth pins its own torch build and resolving both produces a broken
# pair. Pinned to the version the extraction contract was measured against —
# prompt logprobs are known to vary across versions, so the pin is part of the
# artifact's provenance.
extraction = [
    "vllm==0.26.0",
]
# On-policy distillation: the teacher runs as a `trl vllm-serve` sidecar inside
# the trainer's own container, so this stack needs vLLM *and* the training
# libraries, and must not contain unsloth. The vLLM pin deliberately differs
# from `extraction` above because TRL 1.9.2 requires vllm<=0.25.1.
on-policy = [
    "vllm==0.25.1",
    # The on-policy trainers live in trl.experimental, whose stated contract is
    # that APIs may change without notice — hence an exact pin. Unreachable from
    # the `ml` stack above, which unsloth holds at <=0.24.0.
    "trl==1.9.2",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "datasets>=3.2.0",
    "pynvml>=12.0.0",
]
# Alternative PDF backend (richer structure extraction, larger install)
pdf-ml = [
    "docling>=2.0.0",
]

# These three groups are one-per-container by design and cannot co-resolve: the
# unsloth stack pins its own torch build, and the two vLLM groups pin different
# vLLM versions on purpose (see each group above). Declaring the conflict is what
# lets each keep an honest, exact pin instead of being widened into a range that
# satisfies a resolver while matching none of the three contracts. Each Modal
# image installs exactly one of them.
[tool.uv]
conflicts = [
    [{ extra = "ml" }, { extra = "extraction" }, { extra = "on-policy" }],
]
# unsloth-zoo's Apple-silicon mlx stack floats to releases whose
# transformers>=5 floor cannot coexist with the <5 bound in `ml`. Training
# never runs on macOS, so drop the mlx packages from resolution entirely by
# narrowing them to a platform where they are never requested.
override-dependencies = [
    "mlx; sys_platform == 'linux'",
    "mlx-lm; sys_platform == 'linux'",
    "mlx-vlm; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
