[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/db",
    "crates/storage",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Platform Team"]
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# S3 / Object storage
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic", "metrics"] }
tracing-opentelemetry = "0.29"

# Error handling
thiserror = "2"
anyhow = "1"

# Types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
dotenvy = "0.15"
envy = "0.4"

# Crypto
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
subtle = "2"
# AEAD for tenant secrets at rest — no existing AEAD dep in the tree
aes-gcm = "0.10"

# Async traits
async-trait = "0.1"

# Email (SMTP) — async + rustls to match the rest of the stack
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname", "pool"] }

# Utilities
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures = "0.3"
base64 = "0.22"
async-stream = "0.3"
tokio-stream = "0.1"

# Type generation (Rust → TypeScript)
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "serde-compat"] }

# OpenAPI documentation
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Internal crates
platform-shared = { path = "crates/shared" }
platform-db = { path = "crates/db" }
platform-storage = { path = "crates/storage" }
