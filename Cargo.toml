[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/db",
    "crates/storage",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Platform Team"]
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["multipart", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "limit"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# S3 / Object storage
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

# Auth
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Types
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
dotenvy = "0.15"
envy = "0.4"

# Crypto
sha2 = "0.10"
rand = "0.8"

# Utilities
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures = "0.3"
base64 = "0.22"
async-stream = "0.3"
tokio-stream = "0.1"

# Internal crates
platform-shared = { path = "crates/shared" }
platform-db = { path = "crates/db" }
platform-storage = { path = "crates/storage" }
