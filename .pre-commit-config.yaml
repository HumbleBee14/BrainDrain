repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # Rust
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Python
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check src/
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check src/
        language: system
        types: [python]
        pass_filenames: false

      # Frontend
      - id: typescript-check
        name: typescript check
        entry: bash -c "cd apps/web && pnpm type-check"
        language: system
        types: [ts, tsx]
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash -c "cd apps/web && pnpm lint"
        language: system
        types: [ts, tsx]
        pass_filenames: false
