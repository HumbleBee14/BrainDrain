services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 2
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 1
    mem_limit: 512m

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 2
    mem_limit: 1g

  # vLLM inference server with the S3 LoRA resolver plugin baked in.
  # Adapters are fetched from object storage on demand (see infra/serving/).
  # Requires an NVIDIA GPU. Runs only when the "gpu" profile is enabled:
  #   docker compose --profile gpu up vllm
  vllm:
    build:
      context: infra/serving
      dockerfile: Dockerfile.vllm
    profiles: ["gpu"]
    ports:
      - "8080:8000"
    environment:
      # Point the resolver at the dev MinIO bucket.
      S3_LORA_BUCKET: platform-dev
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      --model meta-llama/Llama-3.1-8B
      --enable-lora
      --max-lora-rank 64
      --max-loras 4
      --gpu-memory-utilization 0.85
      --max-model-len 4096
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/platform-dev --ignore-existing;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vllm_cache:

networks:
  default:
    name: platform-net
    external: true
