name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── Rust checks ──
  rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://platform:platform@localhost:5432/platform_test

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      # `cargo test --all` runs the ts-rs export tests, which (re)write the
      # generated TypeScript into apps/web/src/lib/generated. If a DTO changed
      # without `make typegen` being run and committed, those files now differ
      # from what's checked in — fail so stale bindings never reach main.
      - name: Check generated TypeScript types are in sync
        run: |
          git diff --exit-code apps/web/src/lib/generated \
            || { echo "::error::Generated TypeScript types are stale. Run 'make typegen' and commit the result."; exit 1; }

  # ── Frontend checks ──
  frontend:
    name: Frontend (lint + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check shared-types
        run: pnpm --filter @platform/shared-types type-check

      - name: Lint frontend
        run: pnpm --filter web lint

      - name: Type check frontend
        run: pnpm --filter web type-check

  # ── Python checks ──
  python:
    name: Python (ruff + type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: apps/workers
        run: uv sync

      - name: Lint with ruff
        working-directory: apps/workers
        run: uv run ruff check src/

      - name: Format check with ruff
        working-directory: apps/workers
        run: uv run ruff format --check src/

      - name: Check Rust/Python constant sync
        working-directory: apps/workers
        run: uv run python ../../scripts/sync_constants.py --check

      - name: Run tests
        working-directory: apps/workers
        run: uv run pytest -q
