name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/workers/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'infra/deploy/oracle/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/humblebee14/ekcron-api
  IMAGE_WORKERS: ghcr.io/humblebee14/ekcron-workers

jobs:
  build-api:
    name: Build & push API image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./crates/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-workers:
    name: Build & push Workers image (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/workers
          file: ./apps/workers/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_WORKERS }}:latest
            ${{ env.IMAGE_WORKERS }}:${{ github.sha }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  deploy:
    name: Deploy to box
    needs: [build-api, build-workers]
    runs-on: ubuntu-latest
    # Auto-deploy activates once BOX_SSH_KEY is added; until then CI just builds/pushes.
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.BOX_HOST }}
          username: ubuntu
          key: ${{ secrets.BOX_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            git -C ~/ekcron pull --ff-only
            cd ~/ekcron/infra/deploy/oracle
            ./render-env.sh
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d
            echo "Waiting for API health..."
            for i in $(seq 1 20); do
              if docker exec ekcron-api-1 curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "API healthy"; docker logout ghcr.io; exit 0
              fi
              sleep 6
            done
            echo "API did not become healthy"; docker logs ekcron-api-1 --tail 40; docker logout ghcr.io; exit 1
