name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one staging deploy at a time
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Add registry login step when deploying:
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ vars.REGISTRY }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./crates/api/Dockerfile
          push: false  # Set to true when registry is configured
          tags: platform-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: platform-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-workers:
    name: Build Workers image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Workers image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/workers
          file: ./apps/workers/Dockerfile
          push: false
          tags: platform-workers:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
