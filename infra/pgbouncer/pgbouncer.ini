;; PgBouncer configuration for production.
;;
;; Sits between API/workers and PostgreSQL to manage connection pooling.
;; All app services connect to PgBouncer (port 6432) instead of Postgres
;; directly. PgBouncer maintains a smaller pool of real connections to
;; Postgres, reducing per-connection memory and startup overhead.

[databases]
;; Route all connections to the upstream Postgres.
;; Host/port/credentials are injected via environment variables in
;; the entrypoint script (pgbouncer-entrypoint.sh).
platform = host=${DB_HOST:-postgres} port=${DB_PORT:-5432} dbname=${DB_NAME:-platform}

[pgbouncer]
;; Listen on all interfaces inside the container
listen_addr = 0.0.0.0
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode: transaction — each transaction gets a dedicated server
;; connection, released when the transaction commits/rolls back.
;; This is the safest mode for apps that use SET LOCAL, advisory locks
;; within transactions, and per-transaction tenant context.
;; DO NOT use session mode (wastes connections) or statement mode
;; (breaks multi-statement transactions).
pool_mode = transaction

;; Pool sizing — configurable via env vars in docker-compose
;; default_pool_size: connections per user/database pair
;; max_client_conn: total client connections PgBouncer will accept
;; min_pool_size: keep this many server connections warm
;; reserve_pool_size: extra connections for burst traffic
default_pool_size = ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
max_client_conn = ${PGBOUNCER_MAX_CLIENT_CONN:-200}
min_pool_size = ${PGBOUNCER_MIN_POOL_SIZE:-5}
reserve_pool_size = ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
reserve_pool_timeout = 3

;; Timeouts
server_connect_timeout = 5
server_login_retry = 3
query_wait_timeout = 30
client_idle_timeout = 300
server_idle_timeout = 60

;; Housekeeping
server_lifetime = 1800
server_check_delay = 10
server_check_query = SELECT 1

;; Reset connection state between transactions.
;; DEALLOCATE ALL clears prepared statements. DISCARD ALL would be
;; more thorough but is slower and unnecessary since we only use
;; SET LOCAL (auto-reverts on transaction end) for tenant context.
server_reset_query = DEALLOCATE ALL

;; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;; Admin console (for monitoring)
admin_users = pgbouncer_admin
