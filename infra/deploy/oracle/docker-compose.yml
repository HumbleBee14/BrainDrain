name: ekcron

# Deploy stack for the box: app services only. Postgres/Redis/object-storage are
# managed (Neon/Upstash/R2) and injected via env; GPU/vLLM runs on Modal.
# Build contexts are relative to this file (repo root is ../../..).

services:
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.29.3
    restart: unless-stopped
    ports:
      - "7233:7233"
      - "7243:7243" # HTTP API used by the Rust orchestrator client
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    volumes:
      - ../../temporal/dynamicconfig/development-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Runs migrations against the managed DB, then exits. Connects directly (DDL +
  # advisory locks need session state a pooler can't guarantee).
  migrate:
    image: ghcr.io/humblebee14/ekcron-api:${IMAGE_TAG:-latest}
    entrypoint: ["platform-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    restart: "no"

  api:
    image: ghcr.io/humblebee14/ekcron-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      APP_NAME: Ekcron
      DATABASE_URL: ${DATABASE_URL:?}
      DATABASE_RLS_URL: ${DATABASE_RLS_URL:?}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      REDIS_URL: ${REDIS_URL:?}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_REGION: ${S3_REGION:-auto}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      TEMPORAL_HOST: temporal:7243
      TEMPORAL_NAMESPACE: default
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.ekcron.com}
      RATE_LIMIT_ENABLED: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:-}
      FEATURE_FLAGS_PROVIDER: static
      FEATURE_FLAGS_JSON: '{"billing.outbox.enabled":true,"idempotency.enforced":true,"deployments.multi_instance.enabled":false}'
      INFERENCE_BACKEND_TYPE: ${INFERENCE_BACKEND_TYPE:-vllm}
      INFERENCE_SERVER_URL: ${INFERENCE_SERVER_URL:-https://humblebee14--ekcron-vllm-serving-serve.modal.run}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_REQUEST_TIMEOUT_SECS: ${INFERENCE_REQUEST_TIMEOUT_SECS:-600}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # TLS terminator for api.ekcron.com. Auto-provisions a Let's Encrypt cert
  # (HTTP-01) and reverse-proxies to the API. The DNS record is DNS-only so the
  # challenge reaches the box directly.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  workers:
    image: ghcr.io/humblebee14/ekcron-workers:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_TEMPORAL_ADDRESS: temporal:7233
      APP_TEMPORAL_NAMESPACE: default
      APP_TEMPORAL_TASK_QUEUE: ml-pipeline
      APP_DATABASE_URL: ${APP_DATABASE_URL:?}
      APP_REDIS_URL: ${REDIS_URL:?}
      APP_S3_ENDPOINT: ${S3_ENDPOINT:?}
      APP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      APP_S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      APP_S3_BUCKET: ${S3_BUCKET:?}
      APP_S3_REGION: ${S3_REGION:-auto}
      APP_SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_PLATFORM_API_URL: http://api:8000
      APP_PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      APP_MODAL_APP_NAME: ${APP_MODAL_APP_NAME:-platform-training}
      # This host has no GPU, so GPU work must go to Modal; the code default is local.
      APP_GPU_PROVIDER: ${APP_GPU_PROVIDER:-modal}
      APP_WORKER_MODE: all
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  temporal_postgres_data:
  caddy_data:
  caddy_config:
